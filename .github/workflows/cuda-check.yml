name: cuda-check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Keep in sync with release.yml: PTX for sm_75 JITs forward to all newer GPUs; 86 broke
  # Turing (RTX 20xx/Quadro RTX) machines entirely.
  CUDA_COMPUTE_CAP: '75'

jobs:
  rust-cuda-check:
    name: rust-cuda-check
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            libappindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check CUDA toolchain
        run: |
          nvcc --version
          echo "CUDA_COMPUTE_CAP=${CUDA_COMPUTE_CAP}"

      - name: Rust CUDA feature check
        working-directory: src-tauri
        # DirectML is Windows-only and is validated by verify-windows. Keeping this
        # Linux container CUDA-only prevents an irrelevant provider from masking
        # regressions in the CUDA feature set.
        run: cargo check --features cuda
