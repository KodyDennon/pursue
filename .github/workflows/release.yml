name: build-installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.9'
  NODE_VERSION: '24'
  CUDA_VERSION: '12.4.1'
  # candle's kernels are compiled to PTX for this compute capability. PTX JIT-compiles
  # FORWARD to newer GPUs but never backward: '86' (Ampere) shipped binaries whose candle
  # kernels could not run at all on Turing cards (sm_75, e.g. RTX 20xx/Quadro RTX). 7.5 is
  # the oldest generation we support and covers everything newer via driver JIT.
  CUDA_COMPUTE_CAP: '75'
  RUSTFLAGS: '-D warnings'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: verify
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Svelte check
        run: bun run check
      - name: Frontend lint
        run: bun run lint
      - name: Frontend build
        run: bun run build
      - name: Stage pinned PDFium runtime
        run: bash .github/scripts/stage-pdfium.sh
      - name: Rust check
        run: cargo check --features metal
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --features metal
        env:
          PURSUE_PDFIUM_PATH: assets/pdfium
        working-directory: src-tauri

  verify-windows:
    name: verify-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure llama.cpp native toolchain
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            throw "GitHub runner is missing libclang.dll under $llvm"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BINDGEN_EXTRA_CLANG_ARGS=-DPURSUE_BINDGEN=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NVCC_CCBIN=$((Get-Command cl.exe).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=$([Environment]::ProcessorCount)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_BUILD_PARALLEL_LEVEL=$([Environment]::ProcessorCount)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ninja --version
          clang --version
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Rust check (DirectML feature set)
        run: cargo check --features directml
        working-directory: src-tauri
      - name: Stage pinned PDFium runtime
        shell: bash
        run: bash .github/scripts/stage-pdfium.sh
      - name: Stage coherent DirectML runtime
        shell: pwsh
        run: .github/scripts/stage-windows-runtime.ps1
      - name: Rust tests (DirectML feature set)
        shell: pwsh
        run: .github/scripts/run-windows-tests.ps1 -Features directml
        env:
          PURSUE_PDFIUM_PATH: assets/pdfium

  installers:
    name: installer-${{ matrix.name }}
    needs: [verify, verify-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-metal
            platform: macos-26
            args: --target aarch64-apple-darwin --features metal
            bundle_args: ''
            cuda: false
          - name: windows-directml
            platform: windows-2022
            args: --features directml
            bundle_args: --bundles msi,nsis
            cuda: false
          - name: windows-cuda
            platform: windows-2022
            args: --features cuda,directml
            # The self-contained NVIDIA payload exceeds NSIS's 2 GiB compiler
            # mmap limit. MSI and its signed updater bundle support the payload.
            bundle_args: --bundles msi
            cuda: true
    runs-on: ${{ matrix.platform }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure MSVC host compiler
        if: startsWith(matrix.platform, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022

      - name: Configure llama.cpp native toolchain
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) {
            throw "GitHub runner is missing libclang.dll under $llvm"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BINDGEN_EXTRA_CLANG_ARGS=-DPURSUE_BINDGEN=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NVCC_CCBIN=$((Get-Command cl.exe).Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_JOBS=$([Environment]::ProcessorCount)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_BUILD_PARALLEL_LEVEL=$([Environment]::ProcessorCount)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ninja --version
          clang --version

      - name: Install CUDA toolkit
        if: ${{ matrix.cuda }}
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          log-file-suffix: ${{ matrix.name }}.txt

      - name: Verify CUDA toolkit
        if: ${{ matrix.cuda }}
        shell: bash
        run: |
          nvcc --version
          echo "CUDA_PATH=${CUDA_PATH}"
          echo "CUDA_COMPUTE_CAP=${CUDA_COMPUTE_CAP}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Add macOS targets
        if: startsWith(matrix.platform, 'macos-')
        run: rustup target add aarch64-apple-darwin
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Stage pinned PDFium runtime
        shell: bash
        run: bash .github/scripts/stage-pdfium.sh
      - name: Compile selected native provider set
        run: cargo check ${{ matrix.args }}
        working-directory: src-tauri
      - name: Stage Windows native provider runtime
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          if ('${{ matrix.cuda }}' -eq 'true') {
            .github/scripts/stage-windows-runtime.ps1 -Cuda
          } else {
            .github/scripts/stage-windows-runtime.ps1
          }
      - name: Validate staged installer resources
        shell: bash
        run: |
          test -s src-tauri/assets/pdfium/pdfium.dll || test -s src-tauri/assets/pdfium/libpdfium.dylib
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            test -s src-tauri/assets/native_runtime/DirectML.dll
            test -s src-tauri/assets/native_runtime/vc_redist.x64.exe
          fi
          if [[ "${{ matrix.cuda }}" == "true" ]]; then
            test -s src-tauri/assets/native_runtime/cudnn64_9.dll
            test -s src-tauri/assets/native_runtime/cufft64_11.dll
            test -s src-tauri/assets/native_runtime/onnxruntime_providers_cuda.dll
          fi
      - name: Reclaim Windows staging build space
        if: startsWith(matrix.platform, 'windows-')
        run: cargo clean --profile dev
        working-directory: src-tauri
      - name: Build Tauri installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ matrix.bundle_args }} --no-sign
      - name: Normalize updater signing configuration
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          for (const name of ['TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD']) {
            const value = (process.env[name] || '')
              .replace(/^\uFEFF/, '')
              .replace(/\r\n/g, '\n')
              .trim();
            if (!value) throw new Error(`${name} is empty after normalization`);
            const delimiter = `PURSUE_${crypto.randomUUID().replaceAll('-', '')}`;
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`);
          }
          EOF

      - name: Verify updater signing configuration
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Build release installer
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: bun tauri build ${{ matrix.args }} ${{ matrix.bundle_args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename CUDA release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.cuda }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          find src-tauri/target/release/bundle/msi -type f -name "*.msi" -print0 |
            while IFS= read -r -d '' file; do
              dir="$(dirname "$file")"
              base="$(basename "$file")"
              case "$base" in
                *x64_en-US.msi)
                  mv "$file" "$dir/PURSUE.Data.Analyzer_${version}_x64-cuda_en-US.msi"
                  ;;
                *.msi)
                  mv "$file" "$dir/${base%.msi}-cuda.msi"
                  ;;
              esac
            done
          find src-tauri/target/release/bundle/msi -type f \( -name "*.msi.zip" -o -name "*.msi.zip.sig" \) -print0 |
            while IFS= read -r -d '' file; do
              case "$file" in
                *-cuda.msi.zip|*-cuda.msi.zip.sig) ;;
                *.msi.zip.sig) mv "$file" "${file%.msi.zip.sig}-cuda.msi.zip.sig" ;;
                *.msi.zip) mv "$file" "${file%.msi.zip}-cuda.msi.zip" ;;
              esac
            done

      - name: List artifacts (Debug)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          echo "Listing all bundle artifacts in src-tauri/target:"
          find src-tauri/target -name "*.sig" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe"

      - name: upload artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-updater:
    name: publish-updater
    needs: installers
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate strict signed updater manifest
        run: node scripts/generate-updater-manifest.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
      - name: Upload updater manifest
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror-r2:
    name: mirror-r2
    needs: [installers, publish-updater]
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.R2_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify mirror configuration
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$R2_PUBLIC_BASE_URL"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          aws --version
          gh --version

      - name: Mirror release and verify public objects
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REQUIRE_UPDATER_ASSETS: 'true'
        run: bash .github/scripts/mirror-release-to-r2.sh '${{ github.ref_name }}'
