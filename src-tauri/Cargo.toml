[package]
name = "pursue-data-analyzer"
version = "0.11.2"
description = "Local-first PURSUE/WAR.gov OSINT evidence analyzer"
authors = ["PURSUE Data Analyzer contributors"]
edition = "2021"



[lib]
name = "pursue_data_analyzer_lib"
# `cdylib` is Tauri-template boilerplate for Android; this app is desktop-only (no
# `src-tauri/gen`, no mobile CI). Building it produced a 602 MB DLL that the executable never
# imports, and the WiX bundler picked it up off the target directory and packed it into the
# installer — pushing the CUDA payload to 3.1 GB, over the ~2 GB CAB ceiling, so `light.exe`
# failed with LGHT0306 and no CUDA installer shipped for v0.10.11 through v0.11.1. Restore
# `cdylib` alongside a mobile target if one is ever added.
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "pursue-data-analyzer"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "llama-cpp-4/cuda", "ort/cuda", "oar-ocr/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal", "llama-cpp-4/metal", "ort/coreml", "oar-ocr/coreml"]
directml = ["ort/directml", "oar-ocr/directml"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "test"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "cookies", "json", "gzip", "brotli", "zstd"] }
aes-gcm = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
sysinfo = "0.39"
lazy_static = "1"
sqlite-vec = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
tauri-plugin-sql = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
futures-util = "0.3"
lopdf = "0.40"
regex = "1"
url = "2"
image = "0.25"
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_7543", "image_025", "thread_safe"] }
strum = { version = "0.28", features = ["derive"] }
encoding_rs = "0.8"
percent-encoding = "2.3.2"
miniz_oxide = "0.9.1"
scraper = "0.26.0"
log = "0.4.29"
once_cell = "1.21.4"
futures = "0.3.32"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
# llama-cpp-4 exposes helpers backed by llama.cpp's common library even when
# its optional speculative API is unused.  Enabling `mtmd` makes the sys crate
# compile/link that common library on every platform; without it, 0.4.2 passes
# `cargo check` but fails during the final Windows link with unresolved symbols.
llama-cpp-4 = { version = "0.4.2", default-features = false, features = ["mtmd"] }
# Needed only for the ggml log-callback signature, so llama.cpp's fatal diagnostics can be
# forwarded into the app log instead of being discarded. Already built as a transitive
# dependency (and patched below), so this adds no compilation work.
llama-cpp-sys-4 = "0.4.2"
tokenizers = "0.23"
ort = { version = "2.0.0-rc.12", features = ["copy-dylibs"] }
num_cpus = "1.17.0"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
oar-ocr = "0.6.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSDictionary", "NSError"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
accelerate-src = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.52.0", features = [
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Graphics_Imaging",
    "Security_Authorization",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT"
] }

[patch.crates-io]
esaxx-rs = { path = "esaxx-rs-patched" }
# Candle 0.11 defines CUDA helpers using names CUDA 12.4 already owns, which
# prevents SM75/Turing builds. This local, source-identical patch namespaces
# only those two helpers; remove it once the upstream crate includes the fix.
candle-kernels = { path = "vendor/candle-kernels" }
# cudaforge reports ordinary cache/thread progress as Cargo warnings. Keep the
# compiler warning channel actionable while retaining status on build stderr.
cudaforge = { path = "vendor/cudaforge" }
# The upstream build script overwrites user-requested CMake parallelism. Our
# narrow patch respects it and bounds Windows CUDA compilation to twelve jobs;
# library code and bundled llama.cpp are unchanged.
llama-cpp-sys-4 = { path = "vendor/llama-cpp-sys-4" }
# oar-ocr-core did not mark requested GPU provider registration as required.
# This narrow patch makes provider load failures fatal while still permitting
# ONNX Runtime's lightweight CPU shape/control nodes inside a GPU graph.
oar-ocr-core = { path = "vendor/oar-ocr-core" }

# Line-table debug info in release builds so Windows crash dumps (WER minidumps)
# can be symbolized against the shipped binary.
[profile.release]
debug = 1
